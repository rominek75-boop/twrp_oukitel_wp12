name: twrp.yml

on:
  push:
    branches: [ main ] # Kompilace se spusti automaticky hned po ulozeni souboru v main
  workflow_dispatch:   # Zustane i moznost rucniho spusteni

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Kontrola zdroju repozitare
      uses: actions/checkout@v4

    - name: Vycisteni mista na disku GitHubu
      run: |
        sudo docker image prune -a -f
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/libexec/docker/cli-plugins/docker-compose

    - name: Bezpecna instalace nastroje Repo a balicku
      run: |
        sudo rm -f /usr/bin/repo
        sudo rm -f /usr/local/bin/repo
        sudo rm -f ~/bin/repo
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        sudo apt-get install -y repo

    - name: Inicializace TWRP zdroju a stazeni
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        mkdir twrp-workspace
        cd twrp-workspace
        # OPRAVENÁ ADRESA REPOZITÁŘE
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

    - name: Priprava Device Tree (Oukitel WP12)
      run: |
        cd twrp-workspace
        mkdir -p device/oukitel/WP12
        cp -r ../* device/oukitel/WP12/ 2>/dev/null || true
        rm -rf device/oukitel/WP12/twrp-workspace

    - name: Samotna kompilace bootovaciho obrazu
      run: |
        cd twrp-workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch twrp_WP12-eng
        make -j$(nproc) bootimage

    - name: Nahranie hotoveho souboru do prilohy (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Oukitel-WP12
        path: twrp-workspace/out/target/product/WP12/boot.img
